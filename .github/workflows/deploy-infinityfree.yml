name: Deploy PHP to InfinityFree

on:
  push:
    branches:
      - main
    paths-ignore:
      - "visual/**"
      - "README.md"
      - "**/*.sql"
      - ".github/INFINITYFREE-SETUP.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinityfree-production
  cancel-in-progress: false

jobs:
  deploy:
    # Enable only after the database details and FTP secrets are confirmed.
    if: ${{ vars.INFINITYFREE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate FTP and database secrets
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD MYSQL_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Generate private database configuration
        shell: bash
        env:
          MYSQL_HOST: sql109.infinityfree.com
          MYSQL_DATABASE: if0_43515581_VoinichMotors
          MYSQL_USERNAME: if0_43515581
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_PORT: "3306"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          keys = ("host", "database", "username", "password", "port")
          values = {key: os.environ["MYSQL_" + key.upper()] for key in keys}
          if not values["password"]:
              raise SystemExit("MYSQL_PASSWORD is empty")

          payload = base64.b64encode(
              json.dumps(values, ensure_ascii=True).encode("utf-8")
          ).decode("ascii")
          php_config = (
              "<?php\n"
              "return json_decode(base64_decode('" + payload +
              "'), true, 512, JSON_THROW_ON_ERROR);\n"
          )
          Path("config.local.php").write_text(php_config, encoding="utf-8")
          PY

      - name: Upload PHP application to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          port: 21
          protocol: ftp
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: htdocs/
          dangerous-clean-slate: false
          exclude: |
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.env*
            **/*.sql
            **/*.zip
            **/README*
            visual/**
